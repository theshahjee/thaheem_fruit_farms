<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mango orchard at Thaheem Fruit Farms">
  <defs>
    <linearGradient id="orch-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF1CC"/>
      <stop offset="55%" stop-color="#FFD37A"/>
      <stop offset="100%" stop-color="#E89A2C"/>
    </linearGradient>
    <linearGradient id="orch-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5C9740"/>
      <stop offset="100%" stop-color="#173010"/>
    </linearGradient>
    <radialGradient id="orch-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFCE0"/>
      <stop offset="60%" stop-color="#FFD45C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFD45C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orch-canopy" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7BB055"/>
      <stop offset="60%" stop-color="#3D7A2A"/>
      <stop offset="100%" stop-color="#173010"/>
    </radialGradient>
  </defs>

  <rect width="500" height="600" fill="url(#orch-sky)"/>

  <!-- sun -->
  <circle cx="370" cy="170" r="140" fill="url(#orch-sun)"/>

  <!-- distant hills -->
  <path d="M0 360 Q 130 320 250 350 T 500 345 L 500 420 L 0 420 Z" fill="#8C4B07" opacity="0.32"/>
  <path d="M0 400 Q 160 365 320 395 T 500 395 L 500 460 L 0 460 Z" fill="#4F3105" opacity="0.45"/>

  <!-- ground -->
  <rect x="0" y="430" width="500" height="170" fill="url(#orch-ground)"/>

  <!-- subtle ground rows -->
  <g opacity="0.18" stroke="#0D1B08" stroke-width="1" fill="none">
    <path d="M-50 470 Q 250 460 550 480"/>
    <path d="M-50 500 Q 250 490 550 510"/>
    <path d="M-50 535 Q 250 525 550 545"/>
    <path d="M-50 575 Q 250 565 550 585"/>
  </g>

  <!-- back row trees -->
  <g>
    <ellipse cx="60"  cy="395" rx="70" ry="50" fill="url(#orch-canopy)"/>
    <rect x="55"  y="395" width="10" height="50" fill="#3A2410"/>
    <ellipse cx="180" cy="385" rx="80" ry="55" fill="url(#orch-canopy)"/>
    <rect x="175" y="385" width="10" height="55" fill="#3A2410"/>
    <ellipse cx="320" cy="390" rx="80" ry="55" fill="url(#orch-canopy)"/>
    <rect x="315" y="390" width="10" height="55" fill="#3A2410"/>
    <ellipse cx="450" cy="395" rx="70" ry="50" fill="url(#orch-canopy)"/>
    <rect x="445" y="395" width="10" height="50" fill="#3A2410"/>
  </g>

  <!-- foreground hero tree (right) -->
  <g>
    <ellipse cx="370" cy="420" rx="140" ry="100" fill="url(#orch-canopy)"/>
    <rect x="362" y="420" width="18" height="120" fill="#3A2410"/>
    <!-- mangoes -->
    <g fill="#F5A623" stroke="#7A4404" stroke-width="1.2">
      <circle cx="295" cy="395" r="9"/>
      <circle cx="340" cy="420" r="11"/>
      <circle cx="395" cy="405" r="10"/>
      <circle cx="430" cy="445" r="12"/>
      <circle cx="375" cy="470" r="11"/>
      <circle cx="320" cy="465" r="9"/>
    </g>
  </g>

  <!-- foreground hero tree (left) -->
  <g>
    <ellipse cx="120" cy="430" rx="130" ry="95" fill="url(#orch-canopy)"/>
    <rect x="112" y="430" width="18" height="120" fill="#3A2410"/>
    <g fill="#F5A623" stroke="#7A4404" stroke-width="1.2">
      <circle cx="60"  cy="415" r="9"/>
      <circle cx="110" cy="440" r="11"/>
      <circle cx="160" cy="425" r="10"/>
      <circle cx="190" cy="465" r="12"/>
      <circle cx="135" cy="480" r="10"/>
      <circle cx="80"  cy="475" r="9"/>
    </g>
  </g>

  <!-- soft warm glow at horizon -->
  <ellipse cx="250" cy="430" rx="320" ry="40" fill="#F5A623" opacity="0.18"/>
</svg>
