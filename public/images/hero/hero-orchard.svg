<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunset over the Thaheem Fruit Farms orchard">
  <defs>
    <linearGradient id="hr-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFE9B4"/>
      <stop offset="55%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#9A5A0A"/>
    </linearGradient>
    <linearGradient id="hr-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3D7A2A"/>
      <stop offset="100%" stop-color="#173010"/>
    </linearGradient>
    <radialGradient id="hr-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D2"/>
      <stop offset="60%" stop-color="#FFD45C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD45C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hr-canopy" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7BB055"/>
      <stop offset="60%" stop-color="#3D7A2A"/>
      <stop offset="100%" stop-color="#173010"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#hr-sky)"/>

  <circle cx="700" cy="370" r="240" fill="url(#hr-sun)"/>

  <!-- distant hills -->
  <path d="M0 660 Q 250 580 500 640 T 1000 620 L 1000 800 L 0 800 Z" fill="#7A4807" opacity="0.32"/>
  <path d="M0 720 Q 320 650 660 700 T 1000 700 L 1000 800 L 0 800 Z" fill="#4F3105" opacity="0.42"/>

  <!-- ground -->
  <rect x="0" y="760" width="1000" height="240" fill="url(#hr-ground)"/>

  <!-- soft glow on horizon -->
  <ellipse cx="500" cy="760" rx="640" ry="50" fill="#F5A623" opacity="0.22"/>

  <!-- mid-row trees -->
  <g>
    <ellipse cx="120" cy="700" rx="120" ry="85" fill="url(#hr-canopy)"/>
    <rect x="111" y="700" width="18" height="110" fill="#3A2410"/>
    <ellipse cx="320" cy="690" rx="130" ry="90" fill="url(#hr-canopy)"/>
    <rect x="311" y="690" width="18" height="110" fill="#3A2410"/>
    <ellipse cx="540" cy="690" rx="140" ry="95" fill="url(#hr-canopy)"/>
    <rect x="531" y="690" width="18" height="115" fill="#3A2410"/>
    <ellipse cx="780" cy="695" rx="130" ry="90" fill="url(#hr-canopy)"/>
    <rect x="771" y="695" width="18" height="115" fill="#3A2410"/>
    <ellipse cx="960" cy="710" rx="100" ry="75" fill="url(#hr-canopy)"/>
    <rect x="951" y="710" width="18" height="100" fill="#3A2410"/>
  </g>

  <!-- hero tree front -->
  <g>
    <ellipse cx="650" cy="780" rx="220" ry="140" fill="url(#hr-canopy)"/>
    <rect x="638" y="780" width="22" height="170" fill="#3A2410"/>
    <g fill="#F5A623" stroke="#7A4404" stroke-width="1.5">
      <circle cx="540" cy="740" r="12"/>
      <circle cx="600" cy="780" r="14"/>
      <circle cx="680" cy="755" r="12"/>
      <circle cx="730" cy="800" r="15"/>
      <circle cx="650" cy="830" r="13"/>
      <circle cx="585" cy="850" r="12"/>
      <circle cx="755" cy="850" r="13"/>
    </g>
  </g>

  <!-- hero tree front-left -->
  <g>
    <ellipse cx="220" cy="800" rx="190" ry="130" fill="url(#hr-canopy)"/>
    <rect x="208" y="800" width="22" height="170" fill="#3A2410"/>
    <g fill="#F5A623" stroke="#7A4404" stroke-width="1.5">
      <circle cx="130" cy="770" r="11"/>
      <circle cx="180" cy="810" r="13"/>
      <circle cx="240" cy="785" r="12"/>
      <circle cx="290" cy="820" r="14"/>
      <circle cx="225" cy="855" r="13"/>
      <circle cx="155" cy="855" r="12"/>
    </g>
  </g>

  <!-- top haze -->
  <rect x="0" y="0" width="1000" height="240" fill="#FFE9B4" opacity="0.18"/>
</svg>
